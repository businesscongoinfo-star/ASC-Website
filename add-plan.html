<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajouter un projet | ASC</title>

<link rel="stylesheet" href="../assets/admin.css">

</head>

<body>

<div class="container">

<h1>Ajouter un nouveau projet</h1>

<form id="projectForm">

<div class="form-group">

<label>Titre du projet</label>

<input
type="text"
id="title"
required>

</div>

<div class="form-group">

<label>Ville</label>

<select id="city">

<option>Brazzaville</option>

<option>Pointe-Noire</option>

<option>Dolisie</option>

<option>Nkayi</option>

<option>Ouesso</option>

<option>Impfondo</option>

<option>Oyo</option>

</select>

</div>

<div class="form-group">

<label>Catégorie</label>

<select id="category">

<option>Villa</option>

<option>Maison</option>

<option>Appartement</option>

<option>Immeuble</option>

<option>Bureau</option>

<option>Magasin</option>

</select>

</div>

<div class="form-group">

<label>Prix (FCFA)</label>

<input
type="number"
id="price"
required>

</div>

<div class="form-group">

<label>Surface</label>

<input
type="text"
id="surface"
placeholder="250 m²">

</div>

<div class="form-group">

<label>Nombre de chambres</label>

<input
type="number"
id="bedrooms">

</div>
<div class="form-group">

<label>Nombre de salles de bain</label>

<input
type="number"
id="bathrooms">

</div>

<div class="form-group">

<label>Statut</label>

<select id="status">

<option value="Disponible">Disponible</option>

<option value="En cours">En cours</option>

<option value="Terminé">Terminé</option>

<option value="Vendu">Vendu</option>

</select>

</div>

<div class="form-group">

<label>Adresse / Localisation</label>

<input
type="text"
id="location"
placeholder="Ex : Centre-ville, Pointe-Noire">

</div>

<div class="form-group">

<label>Chemin de l'image</label>

<input
type="text"
id="image"
placeholder="images/villa1.jpg"
required>

<small>
Exemple : images/villa1.jpg
</small>

</div>

<div class="form-group">

<label>Description du projet</label>

<textarea
id="description"
rows="6"
placeholder="Décrivez le projet..."
required></textarea>

</div>
<div class="form-actions">

<button type="submit" class="btn-save">

💾 Enregistrer le projet

</button>

<button type="reset" class="btn-reset">

🔄 Réinitialiser

</button>

<a href="dashboard.html" class="btn-cancel">

❌ Annuler

</a>

</div>

</form>

</div>

<script type="module" src="../assets/js/add-project.js"></script>

</body>

</html>
